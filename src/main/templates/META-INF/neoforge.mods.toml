modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Minecraft-Bonanaza/Animal-Weights-Scaling/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Minecraft-Bonanaza/Animal-Weights-Scaling"
authors="Minecraft Bonanaza"
description='''
Scales farm animals based on their Animal Weights value. Underfed animals look emaciated; well-fed animals look plump. Width scales more than height.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="animalweights"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
    reason="Reads each animal's weight via WeightAttachment.getWeight"
